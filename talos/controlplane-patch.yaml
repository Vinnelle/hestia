cluster:
  allowSchedulingOnControlPlanes: true
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
  proxy:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
machine:
  features:
    kubePrism:
      enabled: true
      port: 7445
  kubelet:
    extraMounts:
      - destination: /opt/local-path-provisioner
        type: bind
        source: /opt/local-path-provisioner
        options:
          - bind
          - rshared
          - rw
  network:
    nameservers:
      - 9.9.9.9
      - 149.112.112.112
  time:
    servers:
      - time.cloudflare.com
  sysctls:
    vm.max_map_count: "262144"
  systemDiskEncryption:
    state:
      provider: luks2
      keys:
        - nodeID: {}
          slot: 0
    ephemeral:
      provider: luks2
      keys:
        - nodeID: {}
          slot: 0

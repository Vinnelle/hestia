cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    resources:
      requests:
        cpu: 200m
        memory: 1536Mi
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
  proxy:
    disabled: true
  coreDNS:
    image: registry.k8s.io/coredns/coredns:v1.15.0
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
machine:
  features:
    kubePrism:
      enabled: true
      port: 7445
  kubelet:
    extraConfig:
      systemReserved:
        cpu: 50m
        memory: 1536Mi
        ephemeral-storage: 256Mi
        pid: "100"
      evictionHard:
        memory.available: 500Mi
        nodefs.available: 10%
        nodefs.inodesFree: 5%
        imagefs.available: 15%
        imagefs.inodesFree: 5%
    extraMounts:
      - destination: /opt/local-path-provisioner
        type: bind
        source: /opt/local-path-provisioner
        options:
          - bind
          - rshared
          - rw
  network:
    nameservers:
      - 9.9.9.9
      - 149.112.112.112
  time:
    servers:
      - time.cloudflare.com
  sysctls:
    vm.max_map_count: "262144"
  systemDiskEncryption:
    state:
      provider: luks2
      keys:
        - slot: 0
          tpm:
            checkSecurebootStatusOnEnroll: true
    ephemeral:
      provider: luks2
      keys:
        - slot: 0
          tpm:
            checkSecurebootStatusOnEnroll: true

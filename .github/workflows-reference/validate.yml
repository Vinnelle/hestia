name: Validate

on:
  push:
    branches: [prd]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: arc-runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Actionlint
        run: actionlint -color

      - name: Shellcheck
        run: git ls-files '*.sh' | xargs -r shellcheck -S warning

      - name: Javascript syntax
        run: git ls-files '*.js' | xargs -r -n1 node --check

      - name: Site build.sh unit tests
        run: bash hestia/tests/site-build/test.sh

      - name: Yamllint
        run: git ls-files '*.yaml' | xargs -r yamllint -d relaxed

  go:
    runs-on: arc-runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      - name: Fmt, vet, and test every Go module
        run: |
          mapfile -t mods < <(git ls-files '*go.mod')
          for mod in "${mods[@]}"; do
            dir=$(dirname "$mod")
            echo "==> $dir"
            (
              cd "$dir"
              unformatted=$(gofmt -l .)
              if [ -n "$unformatted" ]; then
                echo "::error::gofmt needed in $dir: $unformatted"
                exit 1
              fi
              go vet ./...
              go test ./...
            )
          done

  terraform-test:
    runs-on: arc-runner
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hestia/tests/images_json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Terraform test
        run: |
          terraform init -input=false
          terraform test

  secrets:
    runs-on: arc-runner
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

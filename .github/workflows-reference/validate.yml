name: Validate

# terraform plan/apply live in terraform.yml, not here: this job only fmt/lints.
# Called from terraform.yml (every plan run) so it can't run stale/missing;
# workflow_dispatch stays for standalone manual runs.
on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: arc-runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - run: terraform fmt -check -diff -recursive

      # lints every directory containing .tf files
      - run: tflint --recursive

  go:
    runs-on: arc-runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      - name: Fmt, vet, and test every Go module
        run: |
          git ls-files '*go.mod' | while read -r mod; do
            dir=$(dirname "$mod")
            echo "==> $dir"
            (cd "$dir" && test -z "$(gofmt -l .)" && go vet ./... && go test ./...) || exit 1
          done

  shellcheck:
    runs-on: arc-runner
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # -S warning skips info/style-level findings
      - run: git ls-files '*.sh' | xargs shellcheck -S warning

  yamllint:
    runs-on: arc-runner
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # helm values + Talos patches; workflow .yml is covered by actionlint below
      - run: git ls-files '*.yaml' | xargs yamllint -d relaxed

  actionlint:
    runs-on: arc-runner
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: actionlint -color

  secrets:
    runs-on: arc-runner
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

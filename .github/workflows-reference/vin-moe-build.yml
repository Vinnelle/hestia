name: Deploy vin-moe

on:
  push:
    branches: [prd]
    paths:
      - "hestia/vin-moe/site/**"
      - ".github/workflows/vin-moe-build.yml"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  wait-for-terraform:
    uses: ./.github/workflows/wait-for-terraform.yml

  deploy:
    needs: wait-for-terraform
    uses: ./.github/workflows/site-deploy.yml
    with:
      context: hestia/vin-moe/site
      image: vin-moe/site
      deployment: vin-moe-site
      purge_zone: vin.moe
    secrets: inherit

  mirror:
    needs: deploy
    runs-on: arc-runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: hestia

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Vinnelle/vin.moe
          token: ${{ secrets.GH_API_TOKEN }}
          path: vin.moe

      - name: Sync vin-moe site
        run: |
          mkdir -p vin.moe/site-image vin.moe/github-workflow
          rsync -a --delete --exclude='.git' hestia/hestia/vin-moe/site/ vin.moe/site-image/
          rsync -a hestia/.github/workflows/vin-moe-build.yml vin.moe/github-workflow/

      - uses: ./hestia/.github/actions/git-commit-push
        with:
          path: vin.moe
          message: "sync: mirror vin-moe source from hestia@${{ github.sha }}"

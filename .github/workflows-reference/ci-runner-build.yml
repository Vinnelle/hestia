name: Build CI runner image

on:
  push:
    branches: [prd]
    paths:
      - "hestia/ci-runner/Dockerfile"
      - ".github/workflows/ci-runner-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-push:
    runs-on: arc-runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/harbor-login
        with:
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: network=host

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: hestia/ci-runner
          push: true
          tags: |
            registry.vinnel.cloud/ci-runner/ci-runner:latest
            registry.vinnel.cloud/ci-runner/ci-runner:${{ github.sha }}
          cache-from: type=registry,ref=registry.vinnel.cloud/ci-runner/ci-runner:buildcache
          cache-to: type=registry,ref=registry.vinnel.cloud/ci-runner/ci-runner:buildcache,mode=max

name: Deploy site

on:
  workflow_call:
    inputs:
      context:
        description: "Docker build context path"
        required: true
        type: string
      image:
        description: "Harbor repo path (project/name)"
        required: true
        type: string
      deployment:
        description: "Deployment name in the websites namespace"
        required: true
        type: string
      purge_zone:
        description: "Cloudflare zone name to purge after rollout (empty = skip)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  build-push:
    runs-on: arc-runner
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/harbor-login
        with:
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: network=host

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.context }}
          push: true
          tags: |
            registry.vinnel.cloud/${{ inputs.image }}:latest
            registry.vinnel.cloud/${{ inputs.image }}:${{ github.sha }}
          cache-from: type=registry,ref=registry.vinnel.cloud/${{ inputs.image }}:buildcache
          cache-to: type=registry,ref=registry.vinnel.cloud/${{ inputs.image }}:buildcache,mode=max

  record:
    needs: build-push
    runs-on: arc-runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/record-image-digest
        with:
          updates: '{"${{ inputs.deployment }}":"registry.vinnel.cloud/${{ inputs.image }}@${{ needs.build-push.outputs.digest }}"}'
          message: "deploy: pin ${{ inputs.deployment }} image digest"

  deploy:
    needs: [build-push, record]
    runs-on: arc-runner
    concurrency:
      group: site-deploy-${{ inputs.deployment }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - uses: ./.github/actions/setup-kubectl
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Roll out deployment
        run: |
          kubectl set image "deployment/${{ inputs.deployment }}" -n websites \
            '*=registry.vinnel.cloud/${{ inputs.image }}@${{ needs.build-push.outputs.digest }}'
          kubectl rollout status "deployment/${{ inputs.deployment }}" -n websites

      - name: Purge Cloudflare cache
        if: inputs.purge_zone != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_NAME: ${{ inputs.purge_zone }}
        run: |
          zone_id=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" | jq -re '.result[0].id')
          curl -fsS -X POST \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache" | jq -e '.success'

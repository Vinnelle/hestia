name: Deploy site

on:
  workflow_call:
    inputs:
      targets:
        description: >-
          JSON array of build targets. Each entry is
          {"context": <build context>, "image": <harbor project/name>,
           "deployment": <deployment name in websites, also the images.json key>}.
        required: true
        type: string
      purge_zone:
        description: "Cloudflare zone name to purge after rollout (empty = skip)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: arc-runner
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/harbor-login
        with:
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: network=host

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.target.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            registry.vinnel.cloud/${{ matrix.target.image }}:latest
            registry.vinnel.cloud/${{ matrix.target.image }}:${{ github.sha }}
          cache-from: type=registry,ref=registry.vinnel.cloud/${{ matrix.target.image }}:buildcache
          cache-to: type=registry,ref=registry.vinnel.cloud/${{ matrix.target.image }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - if: github.event_name != 'pull_request'
        uses: ./.github/actions/record-image-digest
        with:
          updates: '{"${{ matrix.target.deployment }}":"registry.vinnel.cloud/${{ matrix.target.image }}@${{ steps.build.outputs.digest }}"}'
          message: "deploy: pin ${{ matrix.target.deployment }} image digest"

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: arc-runner
    permissions:
      contents: read
      actions: write
    concurrency:
      group: site-deploy-${{ github.workflow }}
      cancel-in-progress: true
    timeout-minutes: 30
    env:
      TARGETS: ${{ inputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read back the digests the build job recorded
        run: |
          git fetch --depth=1 origin "$GITHUB_REF_NAME"
          git show FETCH_HEAD:hestia/images.json > /tmp/images.json

      - uses: ./.github/actions/wait-for-terraform

      - uses: ./.github/actions/setup-kubectl
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Roll out deployments
        run: |
          # A brand-new target has no Deployment yet: Terraform creates it from the
          # digest the build job just recorded, which lands in a later commit. Skip
          # it this once instead of failing the whole rollout.
          mapfile -t names < <(jq -r '.[].deployment' <<<"$TARGETS")
          live=()
          for name in "${names[@]}"; do
            if ! kubectl get "deployment/$name" -n websites >/dev/null 2>&1; then
              echo "deployment/$name does not exist yet — Terraform will create it from the recorded digest"
              continue
            fi
            image=$(jq -re --arg n "$name" '.[$n]' /tmp/images.json)
            kubectl set image "deployment/$name" -n websites "*=$image"
            live+=("$name")
          done
          for name in "${live[@]}"; do
            kubectl rollout status "deployment/$name" -n websites
          done

      - name: Purge Cloudflare cache
        if: inputs.purge_zone != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_NAME: ${{ inputs.purge_zone }}
        run: |
          zone_id=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" | jq -re '.result[0].id')
          curl -fsS -X POST \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache" | jq -e '.success'

      - name: Reconcile Terraform against the recorded digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run terraform.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

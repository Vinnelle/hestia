name: Build love

on:
  push:
    branches: [prd]
    paths:
      - "love/love.c"
      - ".github/workflows/love-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  wait-for-terraform:
    uses: ./.github/workflows/wait-for-terraform.yml

  build:
    needs: wait-for-terraform
    runs-on: arc-runner
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compile
        run: cc -O3 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -fPIE -pie -Wl,-z,relro,-z,now -o love/love love/love.c

  mirror:
    needs: build
    runs-on: arc-runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: hestia

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Vinnelle/love
          token: ${{ secrets.GH_API_TOKEN }}
          path: love

      - name: Copy source
        run: cp hestia/love/love.c love/love.c

      - uses: ./hestia/.github/actions/git-commit-push
        with:
          path: love
          message: "sync: mirror love.c from hestia@${{ github.sha }}"

      - name: Release binary
        env:
          GH_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          cc -O3 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -fPIE -pie -Wl,-z,relro,-z,now -o hestia/love/love hestia/love/love.c
          tag="v${{ github.run_number }}"
          gh release view "$tag" --repo Vinnelle/love >/dev/null 2>&1 && exit 0
          gh release create "$tag" hestia/love/love \
            --repo Vinnelle/love \
            --title "$tag" \
            --notes "compiled from hestia@${{ github.sha }}"

name: Terraform Plan/Apply

on:
  push:
    branches: [prd]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  plan-apply:
    needs: validate
    runs-on: arc-runner
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hestia
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_API_TOKEN }}
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ runner.os }}-${{ hashFiles('hestia/.terraform.lock.hcl') }}

      - name: Create plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Terraform Init
        run: terraform init -input=false

      - id: plan
        name: Terraform Plan
        run: |
          set +e
          terraform plan -input=false -out=tfplan -detailed-exitcode
          exit_code=$?
          echo "exitcode=$exit_code" >> "$GITHUB_OUTPUT"
          [ "$exit_code" -ne 1 ]

      - name: Terraform Apply
        if: github.ref == 'refs/heads/prd' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.plan.outputs.exitcode == '2'
        run: terraform apply -input=false tfplan

name: Deploy vinnel-cloud

on:
  push:
    branches: [prd]
    paths:
      - "hestia/vinnel-cloud/site/**"
      - "hestia/vinnel-cloud/admin/**"
      - ".github/workflows/vinnel-cloud-build.yml"
      - ".github/workflows/site-deploy.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "hestia/vinnel-cloud/site/**"
      - "hestia/vinnel-cloud/admin/**"
      - ".github/workflows/vinnel-cloud-build.yml"
      - ".github/workflows/site-deploy.yml"
      - ".github/actions/**"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/site-deploy.yml
    with:
      targets: >-
        [{"context": "hestia/vinnel-cloud/site",
          "image": "vinnel-cloud/site",
          "deployment": "vinnel-cloud-site"},
         {"context": "hestia/vinnel-cloud/admin",
          "image": "vinnel-cloud/admin",
          "deployment": "vinnel-cloud-admin"}]
      purge_zone: vinnel.cloud
    secrets: inherit

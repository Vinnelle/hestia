name: Build shell

on:
  push:
    branches: [prd]
    paths:
      - "hestia/shell/Dockerfile"
      - ".github/workflows/shell-build.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "hestia/shell/Dockerfile"
      - ".github/workflows/shell-build.yml"
      - ".github/actions/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: arc-runner
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/harbor-login
        with:
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: network=host

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: hestia/shell/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            registry.vinnel.cloud/vinnel-cloud/shell:${{ github.sha }}
          cache-from: type=registry,ref=registry.vinnel.cloud/vinnel-cloud/shell:buildcache
          cache-to: type=registry,ref=registry.vinnel.cloud/vinnel-cloud/shell:buildcache,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - if: github.event_name != 'pull_request'
        uses: ./.github/actions/record-image-digest
        with:
          updates: '{"vinnel-cloud-shell":"registry.vinnel.cloud/vinnel-cloud/shell@${{ steps.build.outputs.digest }}"}'
          message: "deploy: pin shell image digest"

      - name: Reconcile Terraform against the recorded digest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run terraform.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

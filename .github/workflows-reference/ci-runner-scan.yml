name: Scan CI runner image

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: arc-runner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/harbor-login
        with:
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Run Grype vulnerability scan
        id: scan
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: registry.vinnel.cloud/ci-runner/ci-runner:latest
          severity-cutoff: high

      - name: Upload Grype scan results to GitHub Security
        if: always() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure')
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Trigger ci-runner rebuild
        if: steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::vulnerabilities found in ci-runner image, triggering a rebuild"
          gh workflow run ci-runner-build.yml --repo "${{ github.repository }}" --ref prd

name: Wait for Terraform

on:
  workflow_call: {}

permissions:
  actions: write
  contents: read

jobs:
  wait:
    runs-on: arc-runner
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/wait-for-terraform

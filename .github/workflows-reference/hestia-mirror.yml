name: Mirror hestia

on:
  push:
    branches: [prd]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  wait-for-terraform:
    uses: ./.github/workflows/wait-for-terraform.yml

  mirror:
    needs: wait-for-terraform
    runs-on: arc-runner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: gaia

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Vinnelle/hestia
          token: ${{ secrets.GH_API_TOKEN }}
          path: hestia

      - name: Sync hestia mirror
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github/workflows' gaia/hestia/ hestia/

          rm -rf hestia/.github
          mkdir -p hestia/.github
          rsync -a gaia/.github/actions hestia/.github/
          rsync -a gaia/.github/workflows/ hestia/.github/workflows-reference/

      - uses: ./gaia/.github/actions/git-commit-push
        with:
          path: hestia
          message: "sync: mirror gaia@${{ github.sha }}"

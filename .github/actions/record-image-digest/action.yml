name: Record image digest
description: Merges deployment->image digest pairs into hestia/images.json and pushes, re-merging onto the remote tip on every attempt so concurrent recorders never conflict.

inputs:
  updates:
    description: JSON object mapping images.json keys to image@digest refs, e.g. '{"momus":"registry/x@sha256:..."}'
    required: true
  message:
    description: Commit message
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        UPDATES: ${{ inputs.updates }}
        MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        for attempt in 1 2 3 4 5; do
          if ! git fetch --depth=1 origin "$GITHUB_REF_NAME"; then
            sleep "$attempt"
            continue
          fi
          git reset --hard FETCH_HEAD

          jq --argjson updates "$UPDATES" '. + $updates' hestia/images.json > hestia/images.json.tmp
          mv hestia/images.json.tmp hestia/images.json
          git add hestia/images.json

          if git diff --cached --quiet; then
            echo "hestia/images.json already records this digest"
            exit 0
          fi

          git commit -m "$MESSAGE"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            exit 0
          fi
          sleep "$attempt"
        done

        echo "::error::failed to push image digest update after five attempts"
        exit 1

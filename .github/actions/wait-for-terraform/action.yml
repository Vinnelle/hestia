name: Wait for Terraform
description: Blocks until the terraform.yml run for this commit completes; dispatches one if none turns up.

inputs:
  timeout-minutes:
    description: Max wall-clock minutes to wait for the run to appear and conclude.
    required: false
    default: "55"
  grace-period-seconds:
    description: How long to wait for a run to show up on its own before dispatching one.
    required: false
    default: "60"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        GRACE_PERIOD_SECONDS: ${{ inputs.grace-period-seconds }}
      run: |
        set -euo pipefail
        repo="${{ github.repository }}"
        sha="${{ github.event.pull_request.head.sha || github.sha }}"
        ref="${{ github.head_ref || github.ref_name }}"
        deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
        grace_deadline=$(( $(date +%s) + GRACE_PERIOD_SECONDS ))

        echo "looking for a Terraform run on $sha (timeout ${TIMEOUT_MINUTES}m)..."
        run_id=""
        dispatched=false
        while [ "$(date +%s)" -lt "$deadline" ]; do
          run_id=$(gh run list --repo "$repo" --workflow=terraform.yml \
            --json headSha,databaseId --jq ".[] | select(.headSha==\"$sha\") | .databaseId" | head -n1)
          [ -n "$run_id" ] && break

          if [ "$dispatched" = false ] && [ "$(date +%s)" -ge "$grace_deadline" ]; then
            echo "no run found after ${GRACE_PERIOD_SECONDS}s, dispatching terraform.yml on $ref..."
            gh workflow run terraform.yml --repo "$repo" --ref "$ref"
            dispatched=true
          fi

          sleep 10
        done

        if [ -z "$run_id" ]; then
          echo "::error::no Terraform run found for $sha within ${TIMEOUT_MINUTES}m"
          exit 1
        fi

        echo "waiting on Terraform run $run_id..."
        conclusion=""
        while [ "$(date +%s)" -lt "$deadline" ]; do
          status=$(gh run view "$run_id" --repo "$repo" --json status --jq .status)
          if [ "$status" = "completed" ]; then
            conclusion=$(gh run view "$run_id" --repo "$repo" --json conclusion --jq .conclusion)
            break
          fi
          sleep 10
        done

        if [ -z "$conclusion" ]; then
          echo "::error::Terraform run $run_id did not complete within ${TIMEOUT_MINUTES}m"
          exit 1
        fi

        echo "Terraform run $run_id concluded: $conclusion"
        [ "$conclusion" = "success" ]

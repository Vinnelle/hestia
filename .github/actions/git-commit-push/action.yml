name: Commit and push
description: Stages all changes under the given path, commits if anything is staged, and pushes with a fetch/rebase/push retry loop.

inputs:
  path:
    description: Directory containing the git repo to commit/push (the checkout's working-directory)
    required: true
  message:
    description: Commit message
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.path }}
      env:
        MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A

        if git diff --cached --quiet; then
          exit 0
        fi
        git commit -m "$MESSAGE"

        branch=$(git rev-parse --abbrev-ref HEAD)

        pushed=""
        for attempt in 1 2 3 4 5; do
          if git fetch origin "$branch" \
             && git rebase "origin/$branch" \
             && git push origin "HEAD:$branch"; then
            pushed=1
            break
          fi
          git rebase --abort >/dev/null 2>&1 || true
          sleep "$attempt"
        done

        if [ -z "$pushed" ]; then
          echo "::error::failed to push after five attempts"
          exit 1
        fi

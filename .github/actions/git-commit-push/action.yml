name: Commit and push
description: Publishes the working tree at the given path as one commit on top of the remote tip, retrying the whole re-parent/commit/push cycle on a push race.

inputs:
  path:
    description: Directory containing the git repo to commit/push (the checkout's working-directory)
    required: true
  message:
    description: Commit message
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.path }}
      env:
        MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        branch=$(git rev-parse --abbrev-ref HEAD)

        for attempt in 1 2 3 4 5; do
          if ! { git fetch --depth=1 origin "$branch" && git reset --soft FETCH_HEAD; }; then
            sleep "$attempt"
            continue
          fi
          git add -A

          if git diff --cached --quiet; then
            echo "mirror already up to date"
            exit 0
          fi

          git commit -m "$MESSAGE"
          if git push origin "HEAD:$branch"; then
            exit 0
          fi
          sleep "$attempt"
        done

        echo "::error::failed to push after five attempts"
        exit 1

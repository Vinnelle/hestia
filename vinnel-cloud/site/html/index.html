<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="vinnel.cloud — cloud infrastructure, run simply.">
  <link rel="canonical" href="https://vinnel.cloud/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="vinnel.cloud">
  <meta property="og:title" content="vinnel.cloud">
  <meta property="og:description" content="Cloud infrastructure, run simply.">
  <meta property="og:url" content="https://vinnel.cloud/">
  <meta property="og:image" content="https://vinnel.cloud/assets/images/vinnel-cloud-social.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="vinnel.cloud">
  <meta name="twitter:description" content="Cloud infrastructure, run simply.">
  <meta name="twitter:image" content="https://vinnel.cloud/assets/images/vinnel-cloud-social.webp">
  <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3MPKF6C22P"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-3MPKF6C22P');</script>
  <script>try{const t=localStorage.theme;if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="icon" type="image/webp" href="assets/images/favicon.webp">
  <link rel="preload" href="assets/css/style.css" as="style">
  <link rel="stylesheet" href="assets/fonts/jetbrains-mono.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>vinnel.cloud</title>
</head>
<body>
  <main class="container">
    <header class="brand">
      <h1 class="wordmark">vinnel<span class="accent">.cloud</span></h1>
      <p class="tagline">Cloud infrastructure, run simply.</p>
    </header>

    <div class="cta">
      <a href="https://dashboard.vinnel.cloud" id="account-btn">login &rarr;</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="theme-toggle" role="group" aria-label="Theme">
      <button class="theme-opt" type="button" data-theme-choice="dark" aria-pressed="false">dark</button>
      <span class="sep" aria-hidden="true">/</span>
      <button class="theme-opt" type="button" data-theme-choice="light" aria-pressed="false">light</button>
    </div>
  </footer>

  <script>fetch('https://dashboard.vinnel.cloud/api/me',{credentials:'include'}).then(function(r){if(r.ok)document.getElementById('account-btn').textContent='dashboard →'}).catch(function(){})</script>
  <script>
    var root = document.documentElement;
    var opts = Array.prototype.slice.call(document.querySelectorAll('.theme-opt'));
    function sync() {
      var active = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      opts.forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.themeChoice === active); });
    }
    sync();
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', sync);
    opts.forEach(function(b){
      b.addEventListener('click', function(){
        root.dataset.theme = b.dataset.themeChoice;
        try { localStorage.theme = b.dataset.themeChoice; } catch(e) {}
        sync();
      });
    });
  </script>
</body>
</html>

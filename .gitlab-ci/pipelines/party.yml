.party_changes: &party_changes
  - "hestia/bots/party/**/*"
  - ".gitlab-ci.yml"
  - ".gitlab-ci/pipelines/party.yml"
  - ".gitlab-ci/pipelines/sites.yml"
  - ".gitlab-ci/scripts/record-image-digest.sh"
  - ".gitlab-ci/scripts/site-deploy.sh"

party_build:
  extends: .site_build
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'
      changes: *party_changes
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $RUN == "party"'
  variables:
    SITE_CONTEXT: hestia/bots/party
    SITE_DOCKERFILE: hestia/bots/party
    SITE_IMAGE: party/party
    SITE_DEPLOYMENT: party

party_deploy:
  extends: .site_deploy
  needs:
    - party_build
    - job: lint
      optional: true
    - job: go
      optional: true
    - job: secrets_scan
      optional: true
    - job: terraform_plan_apply
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'
      changes: *party_changes
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $RUN == "party"'
  script:
    - sh .gitlab-ci/scripts/site-deploy.sh party --namespace bots

party_redeploy:
  extends: .site_deploy
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $RUN == "party_redeploy"'
  script:
    - kubectl rollout restart deployment/party -n bots
    - kubectl rollout status deployment/party -n bots

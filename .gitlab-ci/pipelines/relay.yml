.relay_image_changes: &relay_image_changes
  - "hestia/platform/relay/image/build.sh"
  - "hestia/platform/relay/image/overlay/**/*"

relay_image:
  stage: build
  resource_group: relay_image
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'
      changes: *relay_image_changes
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $RUN == "relay_image"'
  image: alpine:3.24
  before_script:
    - apk add --no-cache --quiet curl git jq
    - !reference [.sops_install, script]
    - OS_AUTH_URL=$(sh .gitlab-ci/scripts/tfvar.sh infomaniak_auth_url)
    - OS_REGION_NAME=$(sh .gitlab-ci/scripts/tfvar.sh infomaniak_region)
    - OS_APPLICATION_CREDENTIAL_ID=$(sh .gitlab-ci/scripts/tfvar.sh infomaniak_application_credential_id)
    - OS_APPLICATION_CREDENTIAL_SECRET=$(sh .gitlab-ci/scripts/tfvar.sh infomaniak_application_credential_secret)
    - export OS_AUTH_URL OS_REGION_NAME OS_APPLICATION_CREDENTIAL_ID OS_APPLICATION_CREDENTIAL_SECRET
  script:
    - sh hestia/platform/relay/image/build.sh
    - sh hestia/platform/relay/image/publish.sh
    - sh .gitlab-ci/scripts/record-relay-image.sh

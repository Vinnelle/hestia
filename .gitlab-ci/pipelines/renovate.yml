renovate:
  stage: sync
  allow_failure: true
  resource_group: renovate
  rules:
    - if: '($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $RUN == "renovate"'
  image: renovate/renovate:44.222.0@sha256:a8cb8222b49d15da701436954b7463427d535eae2203b294655c9a29675c47d1
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: https://gitlab.vinnel.cloud/api/v4
    RENOVATE_TOKEN: "${CI_BOT_TOKEN}"
    RENOVATE_GITHUB_COM_TOKEN: "${GH_API_TOKEN}"
    RENOVATE_REPOSITORIES: vinnel-cloud/gaia
    RENOVATE_AUTODISCOVER: "false"
  script:
    - renovate

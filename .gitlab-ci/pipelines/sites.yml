    SITE_IMAGE: vinnel-cloud/site
    SITE_DEPLOYMENT: vinnel-cloud-site

vinnel_cloud_admin_build:
  extends: .site_build
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'
      changes: *site_changes_vinnel_cloud
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $RUN == "vinnel_cloud"'
  variables:
    SITE_CONTEXT: hestia/vinnel-cloud
    SITE_DOCKERFILE: hestia/vinnel-cloud/admin
    SITE_IMAGE: vinnel-cloud/admin
    SITE_DEPLOYMENT: vinnel-cloud-admin

vinnel_cloud_auth_build:
  extends: .site_build
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'
      changes: *site_changes_vinnel_cloud
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $RUN == "vinnel_cloud"'
  variables:
    SITE_CONTEXT: hestia/vinnel-cloud
    SITE_DOCKERFILE: hestia/vinnel-cloud/auth
    SITE_IMAGE: vinnel-cloud/auth
    SITE_DEPLOYMENT: vinnel-cloud-auth

vinnel_cloud_deploy:
  extends: .site_deploy
  needs:
    - vinnel_cloud_site_build
    - vinnel_cloud_admin_build
    - vinnel_cloud_auth_build
    - job: lint
      optional: true
    - job: go
      optional: true
    - job: secrets_scan
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'
      changes: *site_changes_vinnel_cloud
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $RUN == "vinnel_cloud"'
  script:
    - sh .gitlab-ci/scripts/site-deploy.sh vinnel-cloud-site vinnel-cloud-admin vinnel-cloud-auth --zone vinnel.cloud

.shell_changes: &shell_changes
  - "hestia/shell/Dockerfile"
  - ".gitlab-ci.yml"
  - ".gitlab-ci/pipelines/sites.yml"
  - ".gitlab-ci/scripts/record-image-digest.sh"

shell_build:
  stage: build
  tags: ["privileged-build"]
  retry: 2
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'
      changes: *shell_changes
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $RUN == "shell"'
  image:
    name: moby/buildkit:v${BUILDKIT_VERSION}
    entrypoint: [""]
  before_script:
    - apk add --no-cache jq curl
    - mkdir -p ~/.docker
    - printf '{"auths":{"gitlab.vinnel.cloud":{"auth":"%s"},"%s":{"auth":"%s"}}}' "$(printf '%s:%s' "$CI_DEPENDENCY_PROXY_USER" "$CI_DEPENDENCY_PROXY_PASSWORD" | base64 -w0)" "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 -w0)" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=hestia/shell \
        --opt label:org.opencontainers.image.source=https://gitlab.vinnel.cloud/vinnel-cloud/gaia \
        --opt label:org.opencontainers.image.revision=${CI_COMMIT_SHA} \
        --import-cache type=registry,ref=artifacts.vinnel.cloud/vinnel-cloud/gaia/vinnel-cloud/shell:buildcache \
        --export-cache type=registry,ref=artifacts.vinnel.cloud/vinnel-cloud/gaia/vinnel-cloud/shell:buildcache,mode=max \
        --metadata-file /tmp/meta.json \
        --output type=image,name=artifacts.vinnel.cloud/vinnel-cloud/gaia/vinnel-cloud/shell:${CI_COMMIT_SHA},push=true
      digest=$(jq -r '.["containerimage.digest"]' /tmp/meta.json)
      sh .gitlab-ci/scripts/record-image-digest.sh vinnel-cloud-shell "artifacts.vinnel.cloud/vinnel-cloud/gaia/vinnel-cloud/shell@${digest}"

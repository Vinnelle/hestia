warm_dependency_proxy:
  stage: .pre
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($RUN == "vin_moe" || $RUN == "monke_academy" || $RUN == "vinnel_cloud" || $RUN == "shell")'
  image:
    name: quay.io/skopeo/stable:v${SKOPEO_VERSION}
    entrypoint: [""]
  script:
    - |
      # The dependency proxy has no locking on a cold cache: concurrent site builds racing to
      # resolve the same uncached base image digest can 404 each other (confirmed 2026-08-19 --
      # same digest works fine pulled alone, fails only under concurrent burst). Pulling every
      # base image once, sequentially, here means the parallel build jobs always hit a warm
      # cache instead of racing to fill it.
      for ref in $(grep -rhoE 'FROM gitlab\.vinnel\.cloud/vinnel-cloud/dependency_proxy/containers/[^ ]+' hestia/*/Dockerfile hestia/*/*/Dockerfile 2>/dev/null | awk '{print $2}' | sort -u); do
        # skopeo refuses a combined tag+digest reference ("both a tag and digest are
        # currently not supported") -- strip the tag, the digest alone still pins exactly.
        ref=$(echo "$ref" | sed -E 's/:[^:@]+@/@/')
        echo "warming ${ref}"
        skopeo inspect --raw --creds "${CI_DEPENDENCY_PROXY_USER}:${CI_DEPENDENCY_PROXY_PASSWORD}" "docker://${ref}" >/dev/null
      done

.site_build:
  stage: build
  tags: ["privileged-build"]
  retry: 2
  image:
    name: moby/buildkit:v${BUILDKIT_VERSION}
    entrypoint: [""]
  before_script:
    - apk add --no-cache jq curl
    - mkdir -p ~/.docker
    - printf '{"auths":{"gitlab.vinnel.cloud":{"auth":"%s"},"%s":{"auth":"%s"}}}' "$(printf '%s:%s' "$CI_DEPENDENCY_PROXY_USER" "$CI_DEPENDENCY_PROXY_PASSWORD" | base64 -w0)" "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 -w0)" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=${SITE_CONTEXT} \
        --local dockerfile=${SITE_DOCKERFILE} \
        --opt label:org.opencontainers.image.source=https://gitlab.vinnel.cloud/vinnel-cloud/gaia \
        --opt label:org.opencontainers.image.revision=${CI_COMMIT_SHA} \
        --import-cache type=registry,ref=artifacts.vinnel.cloud/vinnel-cloud/gaia/${SITE_IMAGE}:buildcache \
        --export-cache type=registry,ref=artifacts.vinnel.cloud/vinnel-cloud/gaia/${SITE_IMAGE}:buildcache,mode=max \
        --metadata-file /tmp/meta.json \
        --output "type=image,\"name=artifacts.vinnel.cloud/vinnel-cloud/gaia/${SITE_IMAGE}:${CI_COMMIT_SHA},artifacts.vinnel.cloud/vinnel-cloud/gaia/${SITE_IMAGE}:latest\",push=true"
      digest=$(jq -r '.["containerimage.digest"]' /tmp/meta.json)
      sh .gitlab-ci/scripts/record-image-digest.sh "${SITE_DEPLOYMENT}" "artifacts.vinnel.cloud/vinnel-cloud/gaia/${SITE_IMAGE}@${digest}"

.site_deploy:
  stage: deploy
  image: artifacts.vinnel.cloud/vinnel-cloud/gaia/ci-runner/ci-runner:latest
  before_script:
    - mkdir -p ~/.kube
    - cp "$SITE_DEPLOY_KUBECONFIG" ~/.kube/config

.site_changes_vin_moe: &site_changes_vin_moe
  - "hestia/vin-moe/site/**/*"
  - ".gitlab-ci.yml"
  - ".gitlab-ci/pipelines/sites.yml"
  - ".gitlab-ci/scripts/site-deploy.sh"
  - ".gitlab-ci/scripts/record-image-digest.sh"

.site_changes_monke_academy: &site_changes_monke_academy
  - "hestia/monke-academy/site/**/*"
  - ".gitlab-ci.yml"
  - ".gitlab-ci/pipelines/sites.yml"
  - ".gitlab-ci/scripts/site-deploy.sh"
  - ".gitlab-ci/scripts/record-image-digest.sh"

.site_changes_vinnel_cloud: &site_changes_vinnel_cloud
  - "hestia/vinnel-cloud/**/*"
  - ".gitlab-ci.yml"
  - ".gitlab-ci/pipelines/sites.yml"
  - ".gitlab-ci/scripts/site-deploy.sh"
  - ".gitlab-ci/scripts/record-image-digest.sh"

vin_moe_build:
  extends: .site_build
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'
      changes: *site_changes_vin_moe
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $RUN == "vin_moe"'
  variables:
    SITE_CONTEXT: hestia/vin-moe/site
    SITE_DOCKERFILE: hestia/vin-moe/site
    SITE_IMAGE: vin-moe/site
    SITE_DEPLOYMENT: vin-moe-site

vin_moe_deploy:
  extends: .site_deploy
  needs:
    - vin_moe_build
    - job: lint
      optional: true
    - job: secrets_scan
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'
      changes: *site_changes_vin_moe
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $RUN == "vin_moe"'
  script:
    - sh .gitlab-ci/scripts/site-deploy.sh vin-moe-site --zone vin.moe

monke_academy_build:
  extends: .site_build
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'
      changes: *site_changes_monke_academy
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $RUN == "monke_academy"'
  variables:
    SITE_CONTEXT: hestia/monke-academy/site
    SITE_DOCKERFILE: hestia/monke-academy/site
    SITE_IMAGE: monke-academy/site
    SITE_DEPLOYMENT: monke-academy-site

monke_academy_deploy:
  extends: .site_deploy
  needs:
    - monke_academy_build
    - job: lint
      optional: true
    - job: secrets_scan
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'
      changes: *site_changes_monke_academy
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $RUN == "monke_academy"'
  script:
    - sh .gitlab-ci/scripts/site-deploy.sh monke-academy-site --zone monke.academy

vinnel_cloud_site_build:
  extends: .site_build
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'

.terraform_changes: &terraform_changes
  - "hestia/**/*.tf"
  - "hestia/**/*.tftpl"
  - "hestia/.terraform.lock.hcl"
  - "hestia/platform/manifests/**/*"
  - "hestia/platform/helm-values/**/*"
  - "hestia/sites/site-images.json"
  - "hestia/apps/app-images.json"
  - "hestia/identity/identity-images.json"
  - "hestia/platform/relay/image/**/*"
  - "secrets.sops.json"

.terraform_install:
  script:
    - mkdir -p /tmp/bin
    - curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
    - unzip -q /tmp/terraform.zip -d /tmp/bin
    - chmod 0755 /tmp/bin/terraform
    - export PATH="/tmp/bin:${PATH}"

.sops_install:
  script:
    - mkdir -p /tmp/bin
    - curl -fsSL "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" -o "/tmp/sops-v${SOPS_VERSION}.linux.amd64"
    - curl -fsSL "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.checksums.txt" -o /tmp/sops.checksums.txt
    - expected=$(grep " sops-v${SOPS_VERSION}.linux.amd64$" /tmp/sops.checksums.txt | cut -d' ' -f1)
    - test -n "$expected"
    - echo "$expected  /tmp/sops-v${SOPS_VERSION}.linux.amd64" | sha256sum -c -
    - install -m 0755 "/tmp/sops-v${SOPS_VERSION}.linux.amd64" /tmp/bin/sops
    - export PATH="/tmp/bin:${PATH}"

.terraform_base:
  image: artifacts.vinnel.cloud/vinnel-cloud/gaia/ci-runner/ci-runner:latest
  retry: 2
  variables:
    GODEBUG: "http2client=0"
  before_script:
    - !reference [.terraform_install, script]
    - !reference [.sops_install, script]
    - mkdir -p "${TF_PLUGIN_CACHE_DIR}"
    - cd hestia
    - sops decrypt --output secrets.auto.tfvars.json ../secrets.sops.json
  cache:
    key:
      files:
        - hestia/.terraform.lock.hcl
    paths:
      - .terraform-plugin-cache
    when: always

terraform_plan:
  extends: .terraform_base
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *terraform_changes
  script:
    - terraform fmt -check -diff -recursive
    - tflint --recursive
    - terraform init -input=false
    - |
      set +e
      terraform plan -input=false -lock=false -detailed-exitcode
      exit_code=$?
      set -e
      # -detailed-exitcode returns 2 when the plan has changes, which is the normal
      # case for a merge request. Only a real error (1) fails the job.
      [ "$exit_code" -ne 1 ]

terraform_plan_apply:
  extends: .terraform_base
  stage: deploy
  resource_group: terraform
  needs:
    - job: vin_moe_build
      optional: true
    - job: vinnel_cloud_site_build
      optional: true
    - job: vinnel_cloud_admin_build
      optional: true
    - job: vinnel_cloud_auth_build
      optional: true
    - job: shell_build
      optional: true
    - job: relay_image
      optional: true
    - job: lint
      optional: true
    - job: secrets_scan
      optional: true
    - job: terraform_test
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'
      changes: *terraform_changes
    - if: '$CI_PIPELINE_SOURCE == "web" && ($RUN == "terraform" || $RUN == "relay_image")'
  script:
    - git -C "$CI_PROJECT_DIR" fetch --depth=1 origin "$CI_COMMIT_REF_NAME"
    - git -C "$CI_PROJECT_DIR" checkout FETCH_HEAD -- hestia/sites/site-images.json hestia/apps/app-images.json hestia/identity/identity-images.json hestia/platform/relay/image/image.json
    - terraform fmt -check -diff -recursive
    - tflint --recursive
    - terraform init -input=false
    - |
      set +e
      terraform plan -input=false -out=tfplan -detailed-exitcode
      exit_code=$?
      set -e
      if [ "$exit_code" -eq 1 ]; then exit 1; fi
      if [ "$exit_code" -eq 2 ]; then terraform apply -input=false tfplan; fi

terraform_provider_mirror_sync:
  extends: .terraform_base
  stage: sync
  rules:
    - if: '$CI_COMMIT_BRANCH == "prd" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - "hestia/.terraform.lock.hcl"
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN == "terraform_mirror"'
  script:
    - terraform init -input=false -backend=false
    - terraform providers mirror /tmp/provider-mirror
    - curl -fsSL "https://github.com/rclone/rclone/releases/download/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip" -o /tmp/rclone.zip
    - curl -fsSL "https://github.com/rclone/rclone/releases/download/v${RCLONE_VERSION}/SHA256SUMS" -o /tmp/rclone.sha256sums
    - expected=$(grep " rclone-v${RCLONE_VERSION}-linux-amd64.zip$" /tmp/rclone.sha256sums | cut -d' ' -f1)
    - test -n "$expected"
    - echo "$expected  /tmp/rclone.zip" | sha256sum -c -
    - unzip -q -j /tmp/rclone.zip "rclone-v${RCLONE_VERSION}-linux-amd64/rclone" -d /tmp/bin
    - chmod 0755 /tmp/bin/rclone
    - export RCLONE_S3_PROVIDER=Linode RCLONE_S3_NO_CHECK_BUCKET=true RCLONE_S3_ENDPOINT="${TF_PROVIDER_MIRROR_ENDPOINT}" RCLONE_S3_ACCESS_KEY_ID="${TF_PROVIDER_MIRROR_ACCESS_KEY}" RCLONE_S3_SECRET_ACCESS_KEY="${TF_PROVIDER_MIRROR_SECRET_KEY}"
    - rclone copy /tmp/provider-mirror ":s3:${TF_PROVIDER_MIRROR_BUCKET}"

map $http_user_agent $chat_file {
    default              /chat/index.html;
    "~*^(curl|wget2?)/"  /chat/scripts/chat.sh;
    "~*PowerShell/"      /chat/scripts/chat.ps1;
}

map $http_user_agent $chat_beta_file {
    default              /chat/index.html;
    "~*^(curl|wget2?)/"  /chat/scripts/chat-beta.sh;
    "~*PowerShell/"      /chat/scripts/chat-beta.ps1;
}

server {
    listen 8080 default_server;
    server_name vin.moe;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
    set $blog_upstream "http://vinnel-cloud-admin.vinnel-cloud.svc.cluster.local";

    add_header X-Frame-Options           "SAMEORIGIN"                            always;
    add_header X-Content-Type-Options    "nosniff"                               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"       always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"   always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://blog.vin.moe; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~* \.(?:webp|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control            "public, immutable"                     always;
        add_header X-Frame-Options          "SAMEORIGIN"                            always;
        add_header X-Content-Type-Options   "nosniff"                               always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"       always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"  always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://blog.vin.moe; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        access_log off;
    }

    location ~* "\.[a-f0-9]{8}\.(css|js)$" {
        expires 1y;
        add_header Cache-Control            "public, immutable"                     always;
        add_header X-Frame-Options          "SAMEORIGIN"                            always;
        add_header X-Content-Type-Options   "nosniff"                               always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"       always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"  always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://blog.vin.moe; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        access_log off;
    }

    location = /posts.json {
        proxy_pass $blog_upstream/public/posts.json;
        include /etc/nginx/conf.d/blog-proxy.inc;
    }

    location = /feed.xml {
        proxy_pass $blog_upstream/public/feed.xml;
        include /etc/nginx/conf.d/blog-proxy.inc;
    }

    location ~ ^/posts/([a-z0-9]+(-[a-z0-9]+)*)$ {
        return 301 https://blog.vin.moe/posts/$1;
    }

    location ~ ^(.+)\.html$ {
        return 301 $1;
    }

    location = /chat {
        return 301 https://chat.vin.moe/;
    }

    location = / {
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }
        try_files /index.html =404;
    }

    location / {
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }
        try_files $uri.html $uri/index.html $uri =404;
    }
}

server {
    listen 8080;
    server_name blog.vin.moe;
    root /usr/share/nginx/html;
    absolute_redirect off;

    resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
    set $blog_upstream "http://vinnel-cloud-admin.vinnel-cloud.svc.cluster.local";

    add_header X-Frame-Options           "SAMEORIGIN"                            always;
    add_header X-Content-Type-Options    "nosniff"                               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"       always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"   always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://blog.vin.moe; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /robots.txt {
        try_files /blog/robots.txt =404;
    }

    location = /sitemap.xml {
        proxy_pass $blog_upstream/public/sitemap.xml;
        include /etc/nginx/conf.d/blog-proxy.inc;
    }

    location = /posts.json {
        proxy_pass $blog_upstream/public/posts.json;
        include /etc/nginx/conf.d/blog-proxy.inc;
    }

    location = /feed.xml {
        proxy_pass $blog_upstream/public/feed.xml;
        include /etc/nginx/conf.d/blog-proxy.inc;
    }

    location ~ ^/posts/([a-z0-9]+(-[a-z0-9]+)*)$ {
        proxy_pass $blog_upstream/public/posts/$1;
        include /etc/nginx/conf.d/blog-proxy.inc;
    }

    location ~ "^/media/([a-z0-9][a-z0-9-]*\.[a-z0-9]{1,8})$" {
        proxy_pass $blog_upstream/public/media/$1;
        include /etc/nginx/conf.d/blog-proxy.inc;
    }

    location = / {
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }
        try_files /blog/index.html =404;
    }

    location = /favicon.ico {
        expires 30d;
        access_log off;
    }

    location /css/ {}

    location /js/ {}

    location /fonts/ {}

    location / {
        return 404;
    }
}

server {
    listen 8080;
    server_name chat.vin.moe;
    root /usr/share/nginx/html;
    absolute_redirect off;

    add_header X-Frame-Options           "SAMEORIGIN"                            always;
    add_header X-Content-Type-Options    "nosniff"                               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"       always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"   always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://blog.vin.moe; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = / {
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }
        types {
            text/html  html;
            text/plain sh ps1;
        }
        add_header Vary                      "User-Agent"                            always;
        add_header X-Frame-Options           "SAMEORIGIN"                            always;
        add_header X-Content-Type-Options    "nosniff"                               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"       always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"   always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://blog.vin.moe; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files $chat_file =404;
    }

    location = /beta {
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }
        types {
            text/html  html;
            text/plain sh ps1;
        }
        add_header Vary                      "User-Agent"                            always;
        add_header X-Frame-Options           "SAMEORIGIN"                            always;
        add_header X-Content-Type-Options    "nosniff"                               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"       always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"   always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://blog.vin.moe; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files $chat_beta_file =404;
    }

    location = /chat.sh {
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }
        types {
            text/plain sh;
        }
        try_files /chat/scripts/chat.sh =404;
    }

    location = /chat.ps1 {
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }
        types {
            text/plain ps1;
        }
        try_files /chat/scripts/chat.ps1 =404;
    }

    location = /chat-beta.sh {
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }
        types {
            text/plain sh;
        }
        try_files /chat/scripts/chat-beta.sh =404;
    }

    location = /chat-beta.ps1 {
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }
        types {
            text/plain ps1;
        }
        try_files /chat/scripts/chat-beta.ps1 =404;
    }

    location = /favicon.ico {
        expires 30d;
        access_log off;
    }

    location = /apple-touch-icon.png {}

    location /css/ {}

    location /js/ {}

    location /fonts/ {}

    location / {
        return 404;
    }
}

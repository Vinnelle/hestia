<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="auth.vinnel.cloud — sign in.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
  <script src="/assets/js/theme.js"></script>
  <link rel="preload" href="/assets/css/style.css" as="style">
  <link rel="stylesheet" href="/assets/fonts/jetbrains-mono.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <title>auth.vinnel.cloud</title>
</head>
<body>
  <main class="container">
    <header class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="6" y="6" width="24" height="24" rx="5"/>
        <rect x="34" y="6" width="24" height="24" rx="5" opacity="0.55"/>
        <rect x="6" y="34" width="24" height="24" rx="5" opacity="0.55"/>
        <rect x="34" y="34" width="24" height="24" rx="5"/>
      </svg>
      <p class="wordmark">vinnel<span class="accent">.cloud</span></p>
      <p class="tagline" id="subtitle">sign in.</p>
    </header>

    <form id="login" class="stage" hidden>
      <label class="field">
        <span class="field-label">Username</span>
        <input name="username" autocomplete="username webauthn" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <label class="check">
        <input type="checkbox" name="remember">
        <svg class="tick" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.75l3.75 3.75L13.5 4.5"/></svg>
        <span>Remember me</span>
      </label>
      <div class="actions">
        <button type="submit">Sign in</button>
        <button type="button" class="quiet" id="passkey" hidden>Passkey</button>
      </div>
    </form>

    <form id="totp" class="stage" hidden>
      <label class="field">
        <span class="field-label">One-time code</span>
        <input name="token" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
      </label>
      <div class="actions">
        <button type="submit">Verify</button>
      </div>
    </form>

    <div id="webauthn" class="stage" hidden>
      <p class="hint">Confirm with your passkey or security key.</p>
      <div class="actions">
        <button type="button" id="webauthn-go">Continue</button>
      </div>
    </div>

    <div id="done" class="stage" hidden>
      <p class="hint">Signed in as <span class="accent" id="who"></span></p>
      <div class="actions">
        <a id="continue" href="https://admin.vinnel.cloud/">Continue</a>
        <a class="quiet" href="/logout" id="logout">Log out</a>
      </div>
    </div>

    <p id="msg" role="alert" hidden></p>
  </main>

  <footer class="site-footer">
    <div class="theme-toggle" role="group" aria-label="Theme">
      <button class="theme-opt" type="button" data-theme-choice="dark" aria-pressed="false">dark</button>
      <span class="sep" aria-hidden="true">/</span>
      <button class="theme-opt" type="button" data-theme-choice="light" aria-pressed="false">light</button>
    </div>
  </footer>

  <script src="/assets/js/login.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://vinnel.cloud/">
  <link rel="me" href="https://ieji.de/@ida">
  <link rel="me" href="https://infosec.exchange/@ida">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="vinnel.cloud">
  <meta property="og:title" content="vinnel.cloud">
  <meta property="og:url" content="https://vinnel.cloud/">
  <meta property="og:image" content="https://vinnel.cloud/assets/images/vinnel-cloud-social.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="vinnel.cloud">
  <meta name="twitter:image" content="https://vinnel.cloud/assets/images/vinnel-cloud-social.webp">
  <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3MPKF6C22P"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-3MPKF6C22P');</script>
  <script src="/assets/js/theme.js"></script>
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="preconnect" href="https://admin.vinnel.cloud">
  <link rel="icon" type="image/webp" href="assets/images/favicon.webp">
  <link rel="preload" href="assets/css/style.css" as="style">
  <link rel="stylesheet" href="assets/fonts/jetbrains-mono.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>vinnel.cloud</title>
</head>
<body>
  <main class="container">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="6" y="6" width="24" height="24" rx="5"/>
      <rect x="34" y="6" width="24" height="24" rx="5" opacity="0.55"/>
      <rect x="6" y="34" width="24" height="24" rx="5" opacity="0.55"/>
      <rect x="34" y="34" width="24" height="24" rx="5"/>
    </svg>

    <h1 class="wordmark">vinnel<span class="accent">.cloud</span></h1>
    <a class="cta" href="https://auth.vinnel.cloud/?rd=https%3A%2F%2Fadmin.vinnel.cloud%2F" id="account-btn">
      <span id="account-label">sign in</span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h9.5"/><path d="M8.5 4l4 4-4 4"/></svg>
    </a>
  </main>

  <footer class="site-footer">
    <a class="footer-link" href="https://status.vinnel.cloud/">status</a>
    <div class="theme-toggle" role="group" aria-label="Theme">
      <button class="theme-opt" type="button" data-theme-choice="dark" aria-pressed="false">dark</button>
      <span class="sep" aria-hidden="true">/</span>
      <button class="theme-opt" type="button" data-theme-choice="light" aria-pressed="false">light</button>
    </div>
  </footer>

  <script>
    fetch('https://admin.vinnel.cloud/api/me',{credentials:'include'}).then(function(r){
      if (!r.ok) return;
      return r.json();
    }).then(function(me){
      if (!me || !me.email) return;
      document.getElementById('account-label').textContent = 'admin';
      document.getElementById('account-btn').setAttribute('href', 'https://admin.vinnel.cloud/');
    }).catch(function(){})
  </script>
</body>
</html>

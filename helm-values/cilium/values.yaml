ipam:
  mode: kubernetes
kubeProxyReplacement: false
policyCIDRMatchMode:
  - nodes
operator:
  replicas: 1
hubble:
  relay:
    enabled: true
    prometheus:
      enabled: true
  ui:
    enabled: true
prometheus:
  enabled: true
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
